version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ubuntu-finance-db
    environment:
      POSTGRES_USER: ${DB_USER:-ubuntu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ubuntu}
      POSTGRES_DB: ${DB_NAME:-ubuntu_finance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ubuntu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ubuntu-finance

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: ubuntu-finance-api
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-ubuntu}:${DB_PASSWORD:-ubuntu}@postgres:5432/${DB_NAME:-ubuntu_finance}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      JWT_EXPIRY: 7d
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/backend/src:/app/src
    networks:
      - ubuntu-finance
    command: npm run dev

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: ubuntu-finance-web
    environment:
      REACT_APP_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./packages/frontend/src:/app/src
      - ./packages/frontend/public:/app/public
    networks:
      - ubuntu-finance
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  ubuntu-finance:
    driver: bridge
